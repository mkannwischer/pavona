name: Setup
on:
  workflow_dispatch:
  push:
    branches:
      - mjk/macos-15-debug
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    paths:
      - .github/workflows/setup.yml
      - .github/actions/prepare-env/**
      - util/container/**
      - apt-requirements.txt
      - Brewfile
      - python-requirements.txt
      - pyproject.toml
      - MODULE.bazel
      - MODULE.bazel.lock
      - .bazelrc
      - bazelisk.sh

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos_verilator_smoketest:
    name: macOS Verilator smoketest (${{ matrix.runner }})
    if: ${{ !github.event.repository.private }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: brew bundle install --file=Brewfile
      - name: Install Python dependencies
        run: |
          python3 -m venv ~/.local/share/venv
          echo "$HOME/.local/share/venv/bin" >> "$GITHUB_PATH"
          ~/.local/share/venv/bin/pip install -r python-requirements.txt --require-hashes
      - name: Show the SDK in use
        run: |
          sw_vers
          xcodebuild -version || true
          xcrun --show-sdk-version
          xcrun --show-sdk-path
          grep -m1 ^current-version "$(xcrun --show-sdk-path)/usr/lib/libc++.1.tbd"
      - name: Run UART smoketest on Verilator
        run: |
          bazelisk test \
            --build_tests_only=true \
            --test_timeout=2400,2400,4000,-1 \
            --test_output=errors \
            --verbose_failures \
            --experimental_ui_max_stdouterr_bytes=33554432 \
            --//hw:verilator_options=--threads,1 \
            //sw/device/tests:uart_smoketest_sim_verilator
      - name: Collect action logs
        if: ${{ failure() }}
        run: |
          root="$(bazelisk info execution_root)"
          mkdir -p /tmp/bazel-action-logs
          cp -R "$root/bazel-out/_tmp/actions/." /tmp/bazel-action-logs/ || true
          ls -lS /tmp/bazel-action-logs | head -20
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: bazel-action-logs-${{ matrix.runner }}
          path: /tmp/bazel-action-logs
