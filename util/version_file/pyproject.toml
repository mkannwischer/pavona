[project]
name = "version-file"
version = "0.1.0"
description = "Reader for the version stamp file emitted by the build."
requires-python = ">=3.10, <3.15"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/version_file"]
