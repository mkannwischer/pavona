[project]
name = "reggen"
version = "0.1.0"
description = "Register generator: reads an IP block description and emits RTL, DV and documentation."
readme = "README.md"
requires-python = ">=3.10, <3.15"
dependencies = [
  "basegen",
  "hjson",
  "jsonschema",
  "jsonschema2md",
  "mako",
  "mistletoe",
  "mubi",
  "peakrdl-systemrdl",
  "pyyaml",
  "referencing",
  "semantic-version",
  "systemrdl-compiler",
  "tabulate",
  "version-file",
]

[tool.uv.sources]
basegen = { workspace = true }
mubi = { workspace = true }
version-file = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reggen"]
exclude = ["BUILD"]
