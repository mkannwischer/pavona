[project]
name = "mubi"
version = "0.1.0"
description = "Multi-bit (mubi) encoding helpers shared by the register and OTP generators."
requires-python = ">=3.10, <3.15"
dependencies = ["mako"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mubi"]
